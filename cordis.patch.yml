# @comecaramelos/dsh-hover-information — bundle patch.
#
# Host plane: registers the `hover-info` settings namespace whose
# `active` flag gates the browser enhancer (`src/client.ts` →
# `lib/client.js`). The same plugin row also mounts the `hoverInfo`
# projection unit (`src/unit.ts`) and the `hoverInfo` Typert remote
# (`src/remote.ts`) from its `apply`, so no further patch lines are needed
# for them (docs/PLAN.md §5.3).
- insert:
    - id: hover-info
      name: "@comecaramelos/dsh-hover-information"
      config:
        # Base layer for the settings namespace; user edits resolve above it.
        active: true
